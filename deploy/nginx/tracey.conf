# /etc/nginx/conf.d/tracey.conf, installed by deploy/activate.sh.
# Static site served from the active release. TLS terminates at Cloudflare (proxied record,
# SSL/TLS mode Flexible), so this vhost listens on port 80 only, like the other sites here.
server {
  listen 80;
  server_name tracey.genguardx.ai;

  root /opt/websites/tracey/current;
  index index.html;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css text/xml text/javascript application/javascript application/json image/svg+xml;

  # Security headers. Traces never leave the browser, so nothing here talks to other origins.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
  add_header Permissions-Policy "camera=(),microphone=(),geolocation=(),usb=()" always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; connect-src 'self'; worker-src 'self' blob:; frame-ancestors 'self'" always;

  autoindex off;
  server_tokens off;

  # Hashed build assets never change: cache them for a year.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    # add_header in a location drops the server-level ones, so repeat the essentials.
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  # The page itself must always be revalidated so a new release shows up immediately.
  location / {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; connect-src 'self'; worker-src 'self' blob:; frame-ancestors 'self'" always;
    try_files $uri $uri/ /index.html;
  }
}
