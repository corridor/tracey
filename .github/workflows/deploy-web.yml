name: Deploy website (tracey.genguardx.ai)

# Builds the demo site and promotes it to the websites host. Mirrors corridor/websites:
# the build job has no secrets; the deploy job waits for approval on the `production`
# environment (Settings > Environments > production > Required reviewers).
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and preview the upload only; change nothing on the server
        type: boolean
        default: false
  push:
    branches: [master]
    paths:
      - apps/web/**
      - packages/**
      - fixtures/openinference/**
      - deploy/**
      - .github/workflows/deploy-web.yml
      - .github/actions/promote-build/**
      - pnpm-lock.yaml

permissions:
  contents: read

jobs:
  build:
    runs-on: light-job
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: pnpm/action-setup@v6
        with:
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check
        run: |
          pnpm typecheck
          pnpm test

      - name: Build and stage
        run: deploy/stage.sh

      # Hand the exact build to the deploy job. Secrets are not used here, so
      # nothing in this job can reach the server.
      - name: Package build
        run: tar -C /tmp/stage -czf stage-tracey.tar.gz tracey

      - uses: actions/upload-artifact@v7
        with:
          name: stage-tracey
          path: stage-tracey.tar.gz
          retention-days: 7
          compression-level: 0

  deploy:
    needs: build
    runs-on: light-job
    environment: production
    concurrency:
      group: deploy-tracey
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: stage-tracey

      - name: Unpack build
        run: |
          mkdir -p /tmp/stage
          tar -C /tmp/stage -xzf stage-tracey.tar.gz

      - uses: ./.github/actions/promote-build
        with:
          app: tracey
          dry_run: ${{ inputs.dry_run || 'false' }}
          host: ${{ secrets.DEPLOY_HOST }}
          user: ${{ secrets.DEPLOY_USER }}
          ssh_key: ${{ secrets.DEV_SSH_KEY }}
          known_hosts: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
